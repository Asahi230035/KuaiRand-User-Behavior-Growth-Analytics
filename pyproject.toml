[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kuairand-user-growth-analysis"
version = "1.0.0"
description = "Reproducible KuaiRand-27K activity, engagement, observed return, and content analysis"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "KuaiRand User Growth Analysis contributors"}
]
dependencies = [
  "duckdb>=1.2,<3",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "PyYAML>=6,<7",
  "scipy>=1.10,<2",
  "statsmodels>=0.14,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
